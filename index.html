<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureMe Dashboard</title>
    
    <style>
        :root {
            /* Vibrant background colors so the glass effect pops */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --accent: #6366f1;
            --text: #f8fafc;
            --text-muted: #cbd5e1;
            
            /* Glassmorphism Specs */
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(16px);
        }
        
        body {
            background: var(--bg-gradient);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            width: 100%;
            max-width: 650px;
        }

        h2, h3 {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        
        /* Glass Setup for Form Panel */
        #futureMeForm {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        /* Semitransparent Inputs */
        input, textarea, select {
            width: 100%;
            padding: 0.85rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }
        
        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        
        /* Premium Loader Styles */
        #loader {
            display: none;
            text-align: center;
            padding: 5rem 0;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Glass Result Cards */
        #resultView {
            display: none;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 1.25rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            
            /* Keeping your explicit Calibri styling preferences active */
            font-family: 'Calibri', 'Candara', 'Segoe UI', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.2px;
        }

        /* Ambient subtle left-indicators inside the glass elements */
        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: var(--accent);
        }
        .card.identity-card::before { background: #10b981; }
        .card.moves-card::before { background: #f59e0b; }
        .card.habit-card::before { background: #ec4899; }
        
        .identity-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #a7f3d0;
            padding: 0.35rem 1rem;
            border-radius: 2rem;
            display: inline-block;
            font-size: 0.95rem;
            margin-top: 0.5rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-family: 'Calibri', sans-serif;
        }
        
        .moves-list {
            padding-left: 1.25rem;
        }
        
        .moves-list li {
            margin-bottom: 0.85rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<!-- Top-right Like / Visit widget -->
<div id="likeWidget" style="position:fixed; top:18px; right:18px; z-index:9999; display:flex; gap:8px; align-items:center;">
    <button id="likeBtn" title="Like" style="display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;border:none;background:rgba(255,255,255,0.06);color:var(--text);backdrop-filter:var(--glass-blur);cursor:pointer;"> 
        <svg id="likeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 21s-7.5-4.868-9.5-7.143C-0.5 9.857 3.2 4 8 4c2.4 0 3.7 1.4 4 2.1.3-.7 1.6-2.1 4-2.1 4.8 0 8.5 5.857 5.5 9.857C19.5 16.132 12 21 12 21z" fill="currentColor"/>
        </svg>
        <span id="likeCount">0</span>
    </button>
    <button id="visitBtn" aria-label="Profile visits" style="padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:var(--text-muted);font-size:0.95rem;backdrop-filter:var(--glass-blur);cursor:default;">Profile visits: <span id="visitCount">0</span></button>
</div>

<div class="container">
    <!-- Configuration Form -->
    <form id="futureMeForm">
        <h2>Connect with FutureMe</h2>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required placeholder="Alex">
        </div>
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" required placeholder="28">
        </div>
        <div class="form-group">
            <label for="goal">Dream / Goal</label>
            <textarea id="goal" rows="2" required placeholder="Launch a profitable independent studio software application..."></textarea>
        </div>
        <div class="form-group">
            <label for="struggle">Current Struggle</label>
            <textarea id="struggle" rows="2" required placeholder="Paralysis by analysis and falling into unproductive doomscrolling loops..."></textarea>
        </div>
        <div class="form-group">
            <label for="oneYearVision">One-Year Vision</label>
            <textarea id="oneYearVision" rows="2" required placeholder="Working completely for myself with 10k monthly recurring revenue..."></textarea>
        </div>
        <div class="form-group">
            <label for="tone">FutureMe Tone</label>
            <select id="tone">
                <option value="Compassionate & Empathetic">Compassionate & Empathetic</option>
                <option value="Sharp & Direct">Sharp & Direct (Tough Love)</option>
                <option value="Stoic & Grounded">Stoic & Grounded</option>
            </select>
        </div>
        <button type="submit">Generate My FutureMe</button>
    </form>

    <!-- Premium Loading State -->
    <div id="loader">
        <div class="spinner"></div>
        <h3 id="loaderText">Creating your future identity…</h3>
    </div>

    <!-- Output Dashboard Panel -->
   <div id="resultView">
        <div class="card">
            <h3>Message from your FutureMe</h3>
            <p id="outMessage" style="line-height: 1.6; font-style: italic; color: #e2e8f0;"></p>
        </div>

        <div class="card identity-card">
            <h3>Future Identity</h3>
            <div id="outIdentity" class="identity-badge"></div>
        </div>

        <div class="card moves-card">
            <h3>Next 3 Moves</h3>
            <ol id="outMoves" class="moves-list"></ol>
        </div>

        <div class="card habit-card">
            <h3>One Habit to Start Today</h3>
            <p id="outHabit" style="font-weight: 600; color: #f472b6;"></p>
        </div>
    </div>
</div>

<script>
document.getElementById('futureMeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    // UI Transitions
    document.getElementById('futureMeForm').style.display = 'none';
    document.getElementById('loader').style.display = 'block';
    
    // Package Form Payload
    const payload = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        goal: document.getElementById('goal').value,
        struggle: document.getElementById('struggle').value,
        oneYearVision: document.getElementById('oneYearVision').value,
        tone: document.getElementById('tone').value
    };

    try {
        const response = await fetch('/api/generate-futureme', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('Timeline connection error');
        const data = await response.json();

        // Populate Result Cards
        document.getElementById('outMessage').innerText = data.message;
        document.getElementById('outIdentity').innerText = data.futureIdentity;
        document.getElementById('outHabit').innerText = data.habit;
        
        const movesList = document.getElementById('outMoves');
        movesList.innerHTML = ''; // Reset list
        data.nextMoves.forEach(move => {
            const li = document.createElement('li');
            li.innerText = move;
            movesList.appendChild(li);
        });

        // Toggle Views
        document.getElementById('loader').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';

    } catch (error) {
        alert(error.message);
        document.getElementById('loader').style.display = 'none';
        document.getElementById('futureMeForm').style.display = 'block';
    }
});
</script>

<script>
// Visit + Like counter frontend logic
async function fetchCounts() {
    try {
        const res = await fetch('/api/counts');
        if (!res.ok) return null;
        return await res.json();
    } catch (e) { return null; }
}

async function incrementVisit() {
    try {
        await fetch('/api/visit', { method: 'POST' });
    } catch (e) { /* ignore */ }
}

async function incrementLike() {
    try {
        const res = await fetch('/api/like', { method: 'POST' });
        if (!res.ok) return null;
        return await res.json();
    } catch (e) { return null; }
}

function updateUI(counts) {
    if (!counts) return;
    const likeCount = document.getElementById('likeCount');
    const visitCount = document.getElementById('visitCount');
    likeCount.innerText = counts.likes || 0;
    visitCount.innerText = counts.visits || 0;
    const likeBtn = document.getElementById('likeBtn');
    if (counts.liked) {
        likeBtn.disabled = true;
        likeBtn.style.opacity = '0.6';
        likeBtn.title = 'You already liked this';
    } else {
        likeBtn.disabled = false;
        likeBtn.style.opacity = '1';
        likeBtn.title = 'Like';
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    // Increment visit when the page is opened
    incrementVisit();

    // Fetch latest counts and render
    const counts = await fetchCounts();
    updateUI(counts);

    // Wire like button
    const likeBtn = document.getElementById('likeBtn');
    likeBtn.addEventListener('click', async () => {
        // optimistically prevent double clicks
        likeBtn.disabled = true;
        const updated = await incrementLike();
        if (updated) {
            updateUI(updated);
            if (updated.liked) {
                // keep disabled permanently if server reports already liked
                likeBtn.disabled = true;
                likeBtn.style.opacity = '0.6';
            } else {
                likeBtn.disabled = false;
            }
        } else {
            // re-enable on error
            likeBtn.disabled = false;
        }
    });
});
</script>
</body>
</html>
